<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Connecting · ComisSync</title><link rel="stylesheet" href="../../style.css"></head>
<body><main class="doc" style="text-align:center;padding-top:96px">
<div class="logo" style="margin:0 auto 20px;width:48px;height:48px;font-size:1.3rem">C</div>
<h1 id="title">Connecting your account…</h1>
<p class="muted" id="msg">You will be sent back to ComisSync in a moment.</p>
<p id="fallback" hidden><a class="btn primary" id="go" href="#">Continue to ComisSync</a></p>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var state = params.get('state') || '';
  var target = null;
  try {
    var encoded = state.slice(state.lastIndexOf('.') + 1).replace(/-/g, '+').replace(/_/g, '/');
    var url = new URL(atob(encoded + '==='.slice((encoded.length + 3) % 4)));
    if (/^https?:$/.test(url.protocol) && /\/social\/instagram\/callback$/.test(url.pathname)) target = url.origin + url.pathname + location.search;
  } catch (e) { target = null; }

  if (!target) {
    document.getElementById('title').textContent = 'Nothing to connect here.';
    document.getElementById('msg').textContent = 'Start the connection from the ComisSync app.';
    return;
  }
  document.getElementById('go').href = target;
  location.replace(target);
  setTimeout(function () { document.getElementById('fallback').hidden = false; }, 2500);
})();
</script></body></html>
