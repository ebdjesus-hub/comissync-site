<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Connecting · ComisSync</title><link rel="stylesheet" href="../../style.css"></head>
<body><main class="doc" style="text-align:center;padding-top:96px">
<div class="logo" style="margin:0 auto 20px;width:48px;height:48px;font-size:1.3rem">C</div>
<h1>Connecting your account…</h1>
<p class="muted" id="msg">You will be sent back to ComisSync in a moment.</p>
<p id="fallback" hidden><a class="btn primary" id="go" href="#">Continue to ComisSync</a></p>
</main>
<script>
(function () {
  var target = 'https://promocoes-link.test/social/tiktok/callback' + location.search;
  var go = document.getElementById('go');
  go.href = target;
  if (location.search.indexOf('code=') !== -1 || location.search.indexOf('error=') !== -1) {
    location.replace(target);
    setTimeout(function () { document.getElementById('fallback').hidden = false; }, 2500);
  } else {
    document.getElementById('msg').textContent = 'Nothing to connect here.';
  }
})();
</script></body></html>
